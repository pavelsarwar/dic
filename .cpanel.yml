---
deployment:
  tasks:
    - export DEPLOYPATH=/home/demraedubd/public_html/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/assets"
    - /bin/mkdir -p "$DEPLOYPATH/admin"
    - /bin/mkdir -p "$DEPLOYPATH/api"
    - /bin/cp index.html "$DEPLOYPATH/index.html"
    - /bin/cp faculty.html "$DEPLOYPATH/faculty.html"
    - /bin/cp assets/shared.css "$DEPLOYPATH/assets/shared.css"
    - /bin/cp assets/cms.js "$DEPLOYPATH/assets/cms.js"
    - /bin/cp assets/cms-config.js "$DEPLOYPATH/assets/cms-config.js"
    - /bin/cp admin/panel.php "$DEPLOYPATH/admin/panel.php"
    - /bin/cp admin/index.php "$DEPLOYPATH/admin/index.php"
    - /bin/cp admin/.htaccess "$DEPLOYPATH/admin/.htaccess"
    - /bin/cp api/index.php "$DEPLOYPATH/api/index.php"
    - /bin/cp api/bootstrap.php "$DEPLOYPATH/api/bootstrap.php"
    - /bin/cp api/.htaccess "$DEPLOYPATH/api/.htaccess"
