<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIC CMS — Admin Panel</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f1;color:#21432e;font-family:'Hind Siliguri',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{margin:0}.pill{background:#e1eedf;padding:7px 12px;border-radius:30px}.panel{background:#fff;border:1px solid #dce9da;border-radius:14px;padding:23px;margin:18px 0;box-shadow:0 5px 18px #17441c0a}.grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{border:0;background:#f0f6ed;text-align:left;padding:11px;border-radius:9px}.menu button.active{background:#2f7e44;color:white}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:14px;font-weight:600}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #ceddc9;border-radius:8px;margin-top:5px}textarea{min-height:90px}.wide{grid-column:1/-1}.primary{background:#2f7e44;color:white;border:0;padding:10px 18px;border-radius:8px}.secondary{background:white;color:#285a36;border:1px solid #c7d7c2;padding:9px 15px;border-radius:8px}.danger{color:#a52b25}.item{padding:12px 0;border-bottom:1px solid #e4ebe1;display:flex;align-items:center;justify-content:space-between;gap:10px}.item:last-child{border:0}.status{padding:12px;border-radius:8px;background:#fff4d8;margin:16px 0}.hide{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr}.menu{flex-direction:row;overflow:auto}.menu button{white-space:nowrap}.formgrid{grid-template-columns:1fr}.top{flex-wrap:wrap}}</style></head><body><div class="shell"><div class="top"><div><h1>ডেমরা আইডিয়াল কলেজ</h1><div>DIC Custom CMS · Admin Dashboard</div></div><div><a href="../index.html">← Website</a> <button id="logout" class="secondary hide">Logout</button></div></div><div id="message" class="status" role="status">CMS configuration যাচাই করা হচ্ছে…</div><section id="loginPanel" class="panel hide"><h2>Admin Login</h2><form id="loginForm"><label>ইমেইল<input type="email" id="email" autocomplete="username" required></label><label>পাসওয়ার্ড<input type="password" id="password" autocomplete="current-password" required></label><p><button class="primary">Sign in</button></p></form></section><div id="app" class="grid hide"><aside class="panel"><h3>ম্যানেজমেন্ট</h3><div id="menu" class="menu"></div></aside><main><section class="panel"><h2 id="heading">Content Manager</h2><p id="hint">Content যোগ করুন, Edit করুন অথবা Publish করুন।</p><form id="editor" class="formgrid"><input id="recordId" type="hidden"><label>শিরোনাম / শিক্ষকের নাম<input id="title" required maxlength="250"></label><label>Subject / বিষয়<input id="subject" maxlength="150"></label><label>Designation / পদবি<input id="designation" maxlength="150"></label><label>Department / বিভাগ<input id="department" maxlength="150"></label><label>Image URL<input id="image_url" type="url" placeholder="https://..."></label><label>Attachment URL<input id="attachment_url" type="url" placeholder="https://..."></label><label>Display Order<input id="sort_order" type="number" value="0"></label><label>Slug<input id="slug" placeholder="optional"></label><label class="wide">বিস্তারিত<textarea id="body"></textarea></label><label><input id="published" type="checkbox" style="display:inline;width:auto"> প্রকাশিত (Published)</label><div class="wide"><button class="primary" type="submit">Save Content</button> <button class="secondary" id="reset" type="button">New Entry</button></div></form></section><section class="panel"><h2>Existing Content</h2><div id="list"></div></section></main></div></div><script src="../assets/cms-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const cfg=window.DIC_CMS_CONFIG||{},msg=document.getElementById('message'),login=document.getElementById('loginPanel'),app=document.getElementById('app'),form=document.getElementById('editor'),list=document.getElementById('list');let client,category='teacher',rows=[];const types={teacher:'শিক্ষকবৃন্দ',notice:'নোটিশ',slide:'স্লাইডশো',page:'পেজ',news:'সংবাদ',event:'অনুষ্ঠান',gallery:'গ্যালারি',admission:'ভর্তি',academic:'একাডেমিক'};function status(t){msg.textContent=t}function show(id,on){document.getElementById(id).classList.toggle('hide',!on)}function reset(){form.reset();document.getElementById('recordId').value='';document.getElementById('sort_order').value=0}async function init(){if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){status('Setup pending: Supabase project URL এবং public anon key configuration প্রয়োজন।');return}if(!window.supabase){status('Supabase library load করা যায়নি।');return}client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await client.auth.getSession();await sessionChanged(session)}async function sessionChanged(session){if(!session){show('loginPanel',true);show('app',false);show('logout',false);status('Authorized Admin Login প্রয়োজন।');return}const {data,error}=await client.from('admin_users').select('role').eq('user_id',session.user.id).maybeSingle();if(error||!data){await client.auth.signOut();status('এই অ্যাকাউন্টে CMS admin permission নেই।');show('loginPanel',true);show('app',false);return}show('loginPanel',false);show('app',true);show('logout',true);status('Logged in: '+session.user.email+' · '+data.role);renderMenu();await load()}function renderMenu(){document.getElementById('menu').innerHTML='';Object.entries(types).forEach(([key,value])=>{const b=document.createElement('button');b.textContent=value;b.className=category===key?'active':'';b.onclick=()=>{category=key;reset();renderMenu();load()};document.getElementById('menu').append(b)})}async function load(){document.getElementById('heading').textContent=types[category]+' Manager';const {data,error}=await client.from('cms_content').select('*').eq('type',category).order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){status('Load error: '+error.message);return}rows=data||[];list.replaceChildren();if(!rows.length)list.textContent='এখনো কোনো তথ্য যোগ করা হয়নি।';rows.forEach(row=>{let div=document.createElement('div');div.className='item';let label=document.createElement('span');label.textContent=row.title+' · '+(row.published?'Published':'Draft');let actions=document.createElement('div');let edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>{['id','title','subject','designation','department','image_url','attachment_url','sort_order','slug','body'].forEach(k=>{const el=document.getElementById(k==='id'?'recordId':k);el.value=row[k]??''});document.getElementById('published').checked=row.published;window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='secondary danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('এই তথ্যটি স্থায়ীভাবে মুছে ফেলবেন?'))return;const {error}=await client.from('cms_content').delete().eq('id',row.id);if(error)status(error.message);else await load()};actions.append(edit,' ',del);div.append(label,actions);list.append(div)})}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();status('Signing in…');const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){status(error.message);return}document.getElementById('password').value='';await sessionChanged(data.session)};form.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('recordId').value;const values={type:category,title:document.getElementById('title').value.trim(),subject:document.getElementById('subject').value.trim()||null,designation:document.getElementById('designation').value.trim()||null,department:document.getElementById('department').value.trim()||null,image_url:document.getElementById('image_url').value||null,attachment_url:document.getElementById('attachment_url').value||null,sort_order:Number(document.getElementById('sort_order').value)||0,slug:document.getElementById('slug').value.trim()||null,body:document.getElementById('body').value,published:document.getElementById('published').checked,updated_at:new Date().toISOString()};let query=id?client.from('cms_content').update(values).eq('id',id):client.from('cms_content').insert(values);const {error}=await query;if(error){status('Save failed: '+error.message);return}status('Saved successfully');reset();await load()};document.getElementById('reset').onclick=reset;document.getElementById('logout').onclick=async()=>{await client.auth.signOut();await sessionChanged(null)};init();</script></body></html>
